<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="TCP">
  <!-- TCP：面向连接 —— 两端点握手建立链路 -->
  <g fill="none" stroke="#1677ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 链路 -->
    <path d="M44 60 H76"/>
    <!-- 双向箭头 -->
    <path d="M52 52 L44 60 L52 68"/>
    <path d="M68 52 L76 60 L68 68"/>
    <!-- 两端节点 -->
    <rect x="14" y="40" width="26" height="40" rx="6"/>
    <rect x="80" y="40" width="26" height="40" rx="6"/>
  </g>
</svg>